name: 원본 업데이트 알림

# 원본 모드에 새 릴리스가 나오면 ntfy로 알린다. **얹지도, 재 보지도 않는다.**
#
# ## 왜 재 보기를 걷어냈나
#
# 전에는 새 태그로 조립과 빌드를 러너에서 해 보고 그 결과를 이슈에 적었다. 그 잡은
# 원본이 구조를 바꿀 때마다 죽었다 - 2026-10-17에 v6.08.129가 문장을 L(de, en, ru)로
# 고르게 바뀌자 조립 단계에서 섰다. 원본이 쓰는 방식이 바뀌는 것은 얹을 때 사람이
# 덧대기를 고치며 다룰 일이라, 매일 미리 재는 잡은 원리상 계속 깨진다. 알림만 남긴다
# (사용자 결정, 2026-10-21. 까닭은 docs/decisions.md D-22).
#
# ## 버전을 무엇과 견주는가
#
# **서브모듈 핀의 태그와 견준다.** 원본은 v6.08.129, 우리는 v6.8.129.0이라 번호끼리
# 견주면 안 된다. 판정은 tools/upstream-watch가 하고 그 머리말에 까닭이 있다.
#
# ## 같은 릴리스를 두 번 안 알리는 법
#
# 실행마다 그날 받은 정식 릴리스 태그 목록을 아티팩트 `upstream-seen`으로 남기고,
# 다음 실행은 그 목록을 남긴 가장 최근 성공 실행에서 받아 **목록에 없는 것만** 알린다.
# 시각으로 가르면 시작 시각은 중복을, 끝난 시각은 누락을 낸다(D-22).
#
#   - **성공한 실행만 남긴다.** 보내다 실패하면 목록이 안 올라가서 다음 실행이 다시 보낸다
#   - **시험 실행은 안 남긴다.** 시험 핀으로 본 목록이 기준이 되면 안 된다
#   - **목록이 없으면 시각으로 돌아간다.** 이 방식으로 바꾼 뒤 첫 실행과, 아티팩트가
#     만료될 만큼(90일) 실행이 실패한 경우다. 그때는 직전 성공 예약 실행의 시작 시각을
#     쓰고, 손으로 돌린 실행은 뺀다
#   - **두 실행이 겹치지 않게 한다.** 겹치면 둘 다 같은 옛 목록을 보고 같은 것을 보낸다
#
# ## 비밀 값
#
# ntfy 주소·토픽·계정은 전부 Secrets에 둔다. 공개 저장소라 주소를 여기 적으면 서버
# 이름이 드러난다. 하나라도 비면 알릴 것이 없는 날에도 실패한다 - 설정이 빠진 것을
# 릴리스가 나온 날에야 알면 그날 알림이 없다.
#
# 러너를 windows-latest로 두는 까닭은 build.yml 맨 위에 적어 두었다.

on:
  schedule:
    # 매일 06:00 KST. 예약 실행은 1~2시간 늦게 도는 일이 잦다.
    - cron: "0 21 * * *"
  workflow_dispatch:
    inputs:
      test_pin:
        description: "시험용. 핀을 이 원본 태그로 치고 본 목록과 시각을 안 본다 (예: v6.08.128)"
        required: false
        default: ""

permissions: {}

concurrency:
  group: upstream-watch
  cancel-in-progress: false

# 우리 도구는 한국어로 보고한다. 윈도 러너의 파이썬 stdout은 cp1252라서 그대로
# 두면 첫 한국어 출력에서 UnicodeEncodeError로 죽는다.
env:
  PYTHONIOENCODING: utf-8
  PYTHONUTF8: "1"

jobs:
  notify:
    name: 새 원본 릴리스 알림
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read
      # 직전 성공 실행과 그 실행이 남긴 목록을 읽는다.
      actions: read
    steps:
      - name: 알림 설정이 다 있는지 본다
        shell: bash
        env:
          NTFY_URL: ${{ secrets.NTFY_URL }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_USER: ${{ secrets.NTFY_USER }}
          NTFY_PASSWORD: ${{ secrets.NTFY_PASSWORD }}
        run: |
          missing=""
          for name in NTFY_URL NTFY_TOPIC NTFY_USER NTFY_PASSWORD; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "저장소 Secrets에 없다:$missing" >&2
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          submodules: true

      # 서브모듈 안에서 cd 하지 않는다. cd가 남으면 다음 명령이 원본 저장소에서 돈다.
      #
      # fetch가 없으면 안 되는 자리다. actions/checkout이 서브모듈을 얕게 받으면 태그가
      # 하나만 보여서(2026-09-04 실측: 받은 직후 1개, fetch 뒤 58개) 핀이 어느 태그인지
      # 못 읽는다.
      - name: 핀을 읽는다
        id: pin
        shell: bash
        env:
          TEST_PIN: ${{ inputs.test_pin }}
        run: |
          git -C upstream fetch --tags --force origin
          pin=$(git -C upstream describe --tags --exact-match HEAD 2>/dev/null || echo "")
          if [ -z "$pin" ]; then
            echo "지금 핀이 어느 태그인지 모르겠다. 태그가 아닌 커밋을 가리키고 있다." >&2
            exit 1
          fi
          if [ -n "$TEST_PIN" ]; then
            if ! [[ "$TEST_PIN" =~ ^v[0-9]+(\.[0-9]+)*$ ]]; then
              echo "test_pin은 v6.08.128 같은 꼴이어야 한다: $TEST_PIN" >&2
              exit 1
            fi
            echo "시험 실행이다. 실제 핀 $pin 대신 $TEST_PIN 으로 친다."
            pin="$TEST_PIN"
          fi
          url=$(git config -f .gitmodules submodule.upstream.url)
          slug=$(echo "$url" | sed -E 's#^https://github.com/##; s#\.git$##')
          echo "pin=$pin" >> "$GITHUB_OUTPUT"
          echo "slug=$slug" >> "$GITHUB_OUTPUT"

      # gh에는 시간 제한 옵션이 없어서 단계에 timeout-minutes를 단다.
      - name: 원본 릴리스와 직전 실행을 받는다
        id: fetch
        timeout-minutes: 5
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${{ steps.pin.outputs.slug }}/releases?per_page=30" > releases.json
          since=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow sync.yml \
            --event schedule --status success --limit 1 --json createdAt --jq '.[0].createdAt // ""')
          ours=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName 2>/dev/null || echo "")
          echo "since=$since" >> "$GITHUB_OUTPUT"
          echo "ours=$ours" >> "$GITHUB_OUTPUT"

          # 목록을 남긴 가장 최근 성공 실행을 찾는다. 시험 실행과 이 방식 이전의 실행은
          # 목록이 없어서 건너뛴다. 지금 도는 실행은 아직 성공이 아니라 안 잡힌다.
          from=""
          for id in $(gh run list --repo "$GITHUB_REPOSITORY" --workflow sync.yml \
              --status success --limit 30 --json databaseId --jq '.[].databaseId'); do
            if gh run download "$id" --repo "$GITHUB_REPOSITORY" -n upstream-seen -D prev 2>/dev/null; then
              from="$id"
              break
            fi
          done
          if [ -n "$from" ] && [ ! -f prev/seen.json ]; then
            echo "실행 $from의 upstream-seen에 seen.json이 없다." >&2
            exit 1
          fi
          echo "seen-from=$from" >> "$GITHUB_OUTPUT"

      - uses: astral-sh/setup-uv@v5

      - name: 알릴 것을 고른다
        shell: bash
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TEST_PIN: ${{ inputs.test_pin }}
        run: |
          flag=""
          [ -n "$TEST_PIN" ] && flag="--ignore-since"
          uv run --no-project python tools/upstream-watch/upstream_watch.py \
            --pin "${{ steps.pin.outputs.pin }}" --ours "${{ steps.fetch.outputs.ours }}" \
            --releases releases.json --seen prev/seen.json \
            --since "${{ steps.fetch.outputs.since }}" $flag --write-seen seen.json \
            --topic "$NTFY_TOPIC" --out payload.json | tee judge.md
          from="${{ steps.fetch.outputs.seen-from }}"
          echo "목록 출처: ${from:+실행 }${from:-없음}" | tee -a judge.md

      # ntfy는 JSON을 루트 주소로 받는다. 제목에 한국어가 들어가는데 HTTP 헤더는
      # ASCII만 안전해서 Title 헤더 대신 JSON으로 보낸다.
      #
      # --fail-with-body: 401·404에도 curl이 0으로 끝나면 알림이 안 갔는데 초록이 된다.
      - name: ntfy로 보낸다
        if: hashFiles('payload.json') != ''
        timeout-minutes: 2
        shell: bash
        env:
          NTFY_URL: ${{ secrets.NTFY_URL }}
          NTFY_USER: ${{ secrets.NTFY_USER }}
          NTFY_PASSWORD: ${{ secrets.NTFY_PASSWORD }}
        run: |
          curl -sS --fail-with-body --max-time 60 -u "$NTFY_USER:$NTFY_PASSWORD" \
            -H "Content-Type: application/json" --data-binary @payload.json "$NTFY_URL" > sent.json
          id=$(uv run --no-project python -c "import json; print(json.load(open('sent.json', encoding='utf-8'))['id'])")
          echo "ntfy가 받았다 (메시지 $id)." | tee sent.md

      # 보내기가 끝난 뒤에 올린다. 보내다 실패하면 여기까지 안 오고, 그 실행은 성공이
      # 아니라서 다음 실행이 목록을 그 앞 실행에서 받아 다시 보낸다.
      - name: 다음 실행에 넘길 목록을 남긴다
        if: inputs.test_pin == ''
        uses: actions/upload-artifact@v4
        with:
          name: upstream-seen
          path: seen.json
          if-no-files-found: error
          retention-days: 90

      - name: 잡 요약
        if: always()
        shell: bash
        run: |
          {
            echo "## 원본 업데이트 알림"
            echo
            cat judge.md 2>/dev/null || echo "판정까지 못 갔다."
            if [ -f payload.json ]; then
              echo
              cat sent.md 2>/dev/null || echo "**알릴 것이 있었는데 보내지 못했다.**"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
