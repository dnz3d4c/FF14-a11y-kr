name: 원본 동기화

# 원본의 새 태그를 서브모듈 포인터로 얹고, 조립과 빌드가 서는지 본 다음 PR을 연다.
# rebase가 아니라 체크아웃이다 - 원본 위에 우리 커밋이 없으므로 옮길 것이 없다.
#
# 러너를 windows-latest로 두는 까닭은 build.yml 맨 위에 적어 두었다.

on:
  schedule:
    # 매일 06:00 KST. 업스트림이 하루 1.4개꼴로 태그를 낸다.
    - cron: "0 21 * * *"
  workflow_dispatch:

# 권한은 잡마다 둔다. 최상위에 두면 읽기만 하면 되는 잡까지 쓰기를 갖는다.
#
# 갈라 두는 까닭이 구조에 있다. 새 원본 태그를 체크아웃해 dotnet build를 돌리는 것은
# **원본이 쓴 코드를 실행하는 일**이다 - 원본 csproj에 DeployToDevFolder 같은 커스텀
# MSBuild 타깃이 실제로 있고, 그것이 빌드 중에 돈다. 그 잡이 우리 저장소 쓰기 토큰을
# 함께 갖고 있으면, 원본 저장소가 침해될 때 그 코드가 토큰에 닿는다.
#
# 그래서 원본 코드를 실행하는 잡은 읽기만 갖고, 쓰기를 갖는 잡은 원본 코드를 아예
# 실행하지 않는다. 둘 사이는 아티팩트로만 이어진다.
permissions: {}

# 우리 도구는 한국어로 보고한다. 윈도 러너의 파이썬 stdout은 cp1252라서 그대로
# 두면 첫 한국어 출력에서 UnicodeEncodeError로 죽는다. 로컬에서는 콘솔 인코딩이
# 달라 안 드러나고, 실제 러너에서만 나타난다.
env:
  PYTHONIOENCODING: utf-8
  PYTHONUTF8: "1"

jobs:
  # 얹을 것이 있는지만 본다. 없으면 아래 잡이 skipped로 남는다.
  #
  # 아무것도 안 한 실행을 초록으로 끝내지 않는다. 기존 구조에서는 예약 실행이
  # 12일 연속 초록인데 자동화가 죽어 있었다 - 7건이 전부 26~56초에 아무것도
  # 안 하고 끝났고 빌드 실측은 3분 36초였다. 초록이 "일했다"를 뜻하지 않으면
  # 대시보드는 고장을 감추는 장치가 된다.
  check:
    name: 새 태그 확인
    runs-on: windows-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      current: ${{ steps.look.outputs.current }}
      latest: ${{ steps.look.outputs.latest }}
      has-new: ${{ steps.look.outputs.has-new }}
      proposed: ${{ steps.open.outputs.proposed }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      # 서브모듈 안에서 cd 하지 않는다. cd가 남으면 다음 명령이 원본 저장소에서
      # 돌아 우리 커밋이 원본에 들어간다.
      #
      # fetch가 없으면 안 되는 자리다. actions/checkout이 서브모듈을 얕게 받으면
      # **태그가 하나만 보인다**(2026-09-04 실측: 받은 직후 1개, fetch 뒤 58개).
      # 그 상태에서는 latest가 current와 같아져 "새 태그 없음"으로 조용히 끝난다 -
      # 이 워크플로가 막으려던 바로 그 모양이다. 그래서 받아 온 뒤에 세 가지를 잰다.
      - name: 태그를 견준다
        id: look
        shell: bash
        run: |
          git -C upstream fetch --tags --force origin
          count=$(git -C upstream tag --list 'v*' | wc -l)
          current=$(git -C upstream describe --tags --exact-match HEAD 2>/dev/null || echo "")
          latest=$(git -C upstream tag --list 'v*' --sort=-v:refname | head -1)

          if [ "$count" -le 1 ]; then
            echo "원본 태그가 $count개만 보인다. 받아 오기가 반만 됐다." >&2
            exit 1
          fi
          if [ -z "$current" ]; then
            echo "지금 핀이 어느 태그인지 모르겠다. 태그가 아닌 커밋을 가리키고 있다." >&2
            exit 1
          fi
          if [ -z "$latest" ]; then
            echo "원본의 최신 태그를 못 찾았다." >&2
            exit 1
          fi

          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          if [ "$current" != "$latest" ]; then
            echo "has-new=true" >> "$GITHUB_OUTPUT"
          else
            echo "has-new=false" >> "$GITHUB_OUTPUT"
          fi

      # 같은 판정을 매일 다시 내지 않는다. 태그 하나에 PR이 이미 열려 있는데도
      # 아래 잡들이 매일 전부 다시 조립하고 빌드하며 같은 가지에 새 커밋을 밀어
      # 넣었다. 오류가 아니어도 매일 활동 알림이 되고 러너 시간을 매일 쓴다.
      #
      # GH_TOKEN이 없으면 인증이 안 돼 조회가 바로 죽는다 - 아래 propose의
      # `브랜치와 PR`이 같은 gh 호출 앞에서 이미 그 모양이다. gh에는 시간 제한
      # 옵션이 없어서 단계에 timeout-minutes를 단다.
      - name: 이미 제안했는지 본다
        id: open
        if: steps.look.outputs.has-new == 'true'
        timeout-minutes: 10
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="sync/upstream-${{ steps.look.outputs.latest }}"
          number=$(gh pr list --head "$branch" --state open --json number --jq '.[].number' | head -1)
          echo "proposed=$number" >> "$GITHUB_OUTPUT"

      - name: 잡 요약
        if: always()
        shell: bash
        run: |
          {
            echo "## 원본 태그"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| 지금 핀 | ${{ steps.look.outputs.current }} |"
            echo "| 원본 최신 | ${{ steps.look.outputs.latest }} |"
            echo
            if [ "${{ steps.look.outputs.has-new }}" != "true" ]; then
              echo "새 태그 없음. 아래 잡은 skipped로 남는다."
            elif [ -n "${{ steps.open.outputs.proposed }}" ]; then
              echo "이미 제안했다 - PR #${{ steps.open.outputs.proposed }}. 아래 잡은 skipped로 남는다."
              echo
              echo "같은 판정을 매일 다시 내지 않는다. 그 PR을 얹거나 닫으면 다음 실행이 다시 본다."
            else
              echo "얹을 것이 있다. 아래 잡이 조립과 빌드를 본다."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # 잡 이름이 건너뛴 까닭까지 말한다. 목록에서 이 잡이 skipped인 것을 보는 것만으로
  # "새 태그가 없었구나"를 안다.
  #
  # **동적 이름은 안 된다.** `name: ${{ ... has-new ... }}`를 넣어 봤다가 되돌렸다.
  # 2026-09-04에 실제로 돌려 보니 `if`로 건너뛴 잡은 실행 컨텍스트가 없어서 이름의
  # 표현식이 평가되지 않고 원문 그대로 뜬다 - 목록에 이렇게 나온다.
  #
  #     skipped | needs.check.outputs.has-new == 'true' && '새 버전 얹기' || '새 태그 없음'
  #
  # 구분하고 싶었던 바로 그 경우에 못 읽는 문자열이 뜨므로 목적을 정반대로 이룬다.
  # 정적 이름이 표현식 없이 같은 일을 한다. tools/ci-check가 이 자리를 지킨다.
  #
  # 결론을 실패로 만들지 않는 까닭: 자동화가 제대로 돌아 "새 태그 없음"을 확인한 것과
  # 자동화가 죽은 것을 둘 다 빨강으로 만들면 빨강이 신호이기를 그만둔다. 기존 저장소가
  # 빨강을 무의미하게 만든 것과 같은 실수의 거울상이다.
  #
  # 이 잡은 **원본이 쓴 코드를 실행한다.** 새 태그를 체크아웃해 dotnet build를 돌리고,
  # 원본 csproj에는 커스텀 MSBuild 타깃이 있다. 그래서 읽기 권한만 갖는다.
  port:
    name: 새 버전 얹기 (새 태그가 없거나 이미 제안했으면 건너뜀)
    needs: check
    if: needs.check.outputs.has-new == 'true' && needs.check.outputs.proposed == ''
    runs-on: windows-latest
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.pin.outputs.sha }}
      warnings: ${{ steps.warn.outputs.count }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Dalamud 참조
        id: refs
        uses: ./.github/actions/dalamud-refs
        with:
          token: ${{ github.token }}

      # 옛 핀으로 한 번 조립해 둔다. 새 판의 절대 숫자만으로는 늘었는지 원래
      # 그랬는지가 안 보인다. 문서에 적어 둔 기준선과 대는 방법도 있지만 그
      # 숫자는 손으로 옮겨 적은 것이라 언젠가 실제와 갈라진다.
      - name: 옛 핀으로 조립
        shell: bash
        run: |
          uv run python tools/assemble/assemble.py
          cp build/assemble-report.json before.json

      # 서브모듈 포인터가 가리킬 커밋을 여기서 정한다. 쓰기 잡은 원본을 아예 안
      # 받으므로 그 커밋 해시만 넘겨받아 gitlink를 적는다.
      - name: 새 태그로 갈아 끼운다
        id: pin
        shell: bash
        run: |
          git -C upstream fetch --tags --force origin
          git -C upstream checkout "${{ needs.check.outputs.latest }}"
          echo "sha=$(git -C upstream rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: 조립
        shell: bash
        run: |
          uv run python tools/assemble/assemble.py | tee assemble.log
          cp build/assemble-report.json after.json

      # **여기만 -warnaserror를 안 쓴다.** 이 잡이 재는 것은 원본이 방금 낸 코드이고,
      # 그 코드의 경고는 우리가 고칠 수 없다 - 원본의 결함은 우리가 고치지 않기로
      # 정해 두었다. 게이트로 걸면 초록으로 가는 길이 아예 없어 매일 빨개지고,
      # 그러면 빨강이 신호이기를 그만둔다. 저장소가 이미 같은 논증을 두 곳에 갖고
      # 있다 - build.yml의 "미번역 개수 자체는 실패가 아니다"와 위 check 잡의
      # "새 태그 없음을 실패로 만들지 않는다"다. tools/ci-check의 규칙 9가 이 자리를
      # 지킨다.
      #
      # 컴파일 오류는 그대로 빨강이다. 그것은 **우리 것이다** - 참조 어셈블리 버전이
      # 낡았다는 뜻이고, 2026-09-07에 실제로 그랬다(CS1061을 15.0.3.3으로 올려 풀었다).
      #
      # shell: bash는 pipefail이 켜져 있어서 tee를 거쳐도 dotnet의 실패가 그대로
      # 단계의 실패가 된다.
      - name: 빌드
        shell: bash
        env:
          DALAMUD_HOME: ${{ steps.refs.outputs.home }}
        run: |
          dotnet build -c Release \
            build/FF14Accessibility/FF14Accessibility.csproj | tee build.log

      # 경고를 버리지 않는다. 게이트에서 뺀 대신 **세어서 사람에게 낸다.**
      #
      # 빌드가 서도 돈다. 오류로 죽은 로그에도 경고가 같이 들어 있고, 그것이
      # 무엇을 봐야 하는지 말해 준다.
      #
      # 중복을 없애는 까닭: MSBuild가 마지막 요약 절에서 같은 경고를 들여쓰기만
      # 붙여 되풀이한다. 그대로 세면 개수가 두 배가 되고 같은 줄이 본문에 두 번 온다.
      # 꼬리의 `[...csproj]`도 같은 이유로 뗀다.
      - name: 원본 경고를 센다
        id: warn
        if: always()
        shell: bash
        run: |
          sed -n 's/^[[:space:]]*//; s/[[:space:]]*\[[^][]*\][[:space:]]*$//; /: warning [A-Z][A-Z0-9]*:/p' \
            build.log 2>/dev/null | sort -u > warnings.txt || true
          count=$(wc -l < warnings.txt | tr -d ' ')
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "원본이 데려온 경고 $count개."
          cat warnings.txt

      - name: 미번역 인벤토리
        uses: actions/upload-artifact@v4
        with:
          name: assemble-report-${{ needs.check.outputs.latest }}
          path: |
            before.json
            after.json
          if-no-files-found: error

      # 경고 목록이 본문 맨 앞에 온다. 까닭: master의 build.yml은 -warnaserror로
      # 재므로, **이 PR을 얹으면 그 경고가 곧 master의 빨강이 된다.** 사람이 얹기
      # 전에 그것을 알아야 한다. 그 다음이 고아인데, 업스트림이 그 문장을 고쳤다는
      # 신호라 새 버전을 받을 때 그 다음으로 먼저 봐야 한다.
      - name: PR 본문
        shell: bash
        run: |
          uv run python tools/assemble/compare.py before.json after.json --out change.md
          {
            echo "원본 \`${{ needs.check.outputs.current }}\`에서"
            echo "\`${{ needs.check.outputs.latest }}\`로 옮긴다."
            echo
            if [ -s warnings.txt ]; then
              echo "## 이 버전이 데려오는 경고 ${{ steps.warn.outputs.count }}개"
              echo
              echo "\`master\`의 \`build.yml\`은 \`-warnaserror\`로 잰다."
              echo "**이 PR을 얹으면 아래가 곧 \`master\`의 빨강이 된다.**"
              echo "원본의 결함은 우리가 고치지 않으므로, 얹기 전에 무엇을 할지 사람이 정한다."
              echo "그래서 이 PR은 draft로 열린다."
              echo
              echo '```'
              cat warnings.txt
              echo '```'
            else
              echo "조립과 \`dotnet build -c Release\`가 경고 없이 섰다."
            fi
            echo
            cat change.md
            echo
            echo "<details><summary>조립 보고 전체</summary>"
            echo
            echo '```'
            cat assemble.log
            echo '```'
            echo
            echo "</details>"
          } > body.md

      - name: PR 본문 넘기기
        uses: actions/upload-artifact@v4
        with:
          name: pr-body
          path: body.md
          if-no-files-found: error

      - name: 잡 요약
        if: always()
        shell: bash
        run: |
          {
            echo "## ${{ needs.check.outputs.current }} 에서 ${{ needs.check.outputs.latest }} 로"
            echo
            if [ -s warnings.txt ]; then
              echo "### 이 버전이 데려오는 경고 ${{ steps.warn.outputs.count }}개"
              echo
              echo "게이트가 아니다. master는 \`-warnaserror\`로 재므로 얹기 전에 사람이 본다."
              echo
              echo '```'
              cat warnings.txt
              echo '```'
              echo
            fi
            cat change.md 2>/dev/null || echo "견줄 것을 못 만들었다."
            echo
            echo '```'
            cat assemble.log 2>/dev/null || echo "조립이 결과를 못 남겼다."
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # 쓰기 권한은 여기에만 있다. 이 잡은 **원본 코드를 한 줄도 실행하지 않는다** -
  # 서브모듈을 받지 않고, 조립도 빌드도 안 하고, 앞 잡이 넘긴 글과 커밋 해시만 쓴다.
  #
  # 포인터는 `git update-index --cacheinfo`로 적는다. 서브모듈 내용 없이 gitlink만
  # 갈아 끼우는 방법이라, 원본 트리를 받지 않고도 커밋이 만들어진다.
  propose:
    name: PR 열기 (새 태그가 없거나 이미 제안했으면 건너뜀)
    needs: [check, port]
    if: needs.check.outputs.has-new == 'true' && needs.check.outputs.proposed == ''
    runs-on: windows-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: pr-body

      - name: 브랜치와 PR
        id: pr
        timeout-minutes: 10
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="sync/upstream-${{ needs.check.outputs.latest }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git update-index --add --cacheinfo 160000,${{ needs.port.outputs.sha }},upstream
          git commit -m "[원본] upstream: ${{ needs.check.outputs.latest }}로 옮긴다"
          git push --force-with-lease origin "$branch"
          # 요약은 여기서 쓰지 않는다. 이 단계는 밀고 여는 일을 하므로 always()를
          # 달 수 없고, always() 없이 요약을 쓰면 실패했을 때 그 줄이 같이 사라진다.
          # 무엇을 했는지는 아래 요약 단계가 이 출력을 보고 적는다.
          if [ -n "$(gh pr list --head "$branch" --state open --json number --jq '.[].number')" ]; then
            echo "state=열려 있는 PR에 밀어 넣었다" >> "$GITHUB_OUTPUT"
          else
            # 경고가 하나라도 있으면 draft로 연다. 병합할 준비가 안 된 제안이라는
            # 것을 PR 자신이 말한다 - master는 -warnaserror로 재므로 그대로 얹으면
            # 그 경고가 곧 빨강이 된다.
            #
            # 값이 비어 있을 때도 draft다. 앞 잡이 경고를 못 센 것이지 경고가
            # 없다고 확인된 것이 아니다.
            draft="--draft"
            note="경고를 못 셌다"
            if [ "${{ needs.port.outputs.warnings }}" = "0" ]; then
              draft=""
            elif [ -n "${{ needs.port.outputs.warnings }}" ]; then
              note="경고 ${{ needs.port.outputs.warnings }}개"
            fi
            # 기본 브랜치 이름을 적어 두지 않고 받아 쓴다. 손으로 적으면 이 저장소처럼
            # master를 쓰는 곳에서 main이라고 적힌 채로 조용히 실패한다.
            gh pr create $draft --head "$branch" --base "${{ github.event.repository.default_branch }}" \
              --title "[원본] ${{ needs.check.outputs.latest }}를 얹는다" \
              --body-file body.md
            echo "state=PR을 새로 열었다${draft:+ (draft - $note)}" >> "$GITHUB_OUTPUT"
          fi

      - name: 잡 요약
        if: always()
        shell: bash
        run: |
          {
            echo "## PR"
            echo
            echo "${{ steps.pr.outputs.state || 'PR까지 못 갔다.' }}"
          } >> "$GITHUB_STEP_SUMMARY"
