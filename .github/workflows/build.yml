name: 빌드

# 러너는 windows-latest다. 까닭 셋.
#
#   1. 모드가 net10.0-windows를 대상으로 하고 System.Speech(윈도 전용)를 참조하는데
#      아래에서 -warnaserror로 빌드한다. 다른 OS에서는 플랫폼 호환 경고가 그대로
#      실패가 되고, 그 실패는 우리 코드의 문제가 아니라 러너의 문제다.
#   2. 산출물이 윈도용 플러그인 DLL이다. 도는 곳에서 짓는다.
#   3. 우리 파이썬 도구는 표준 라이브러리만 쓰고 플랫폼 전용 호출이 없어서
#      러너를 가리지 않는다. 곧 제약은 dotnet 쪽 하나뿐이다.
#
# 러너를 바꾸려면 tools/ci-check의 VERIFIED_RUNNERS부터 고쳐야 한다. 그 표는
# "이 OS에서 실제로 확인했다"는 뜻이고, 확인 없이 바꾸면 검사가 막는다.

on:
  push:
    # 이 저장소의 기본 브랜치는 master다. main으로 적으면 워크플로가 조용히 안 돈다 -
    # 문법이 맞아서 검사도 통과하고, 푸시해 봐야만 안 도는 것이 드러난다.
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# 우리 도구는 한국어로 보고한다. 윈도 러너의 파이썬 stdout은 cp1252라서 그대로
# 두면 첫 한국어 출력에서 UnicodeEncodeError로 죽는다. 로컬에서는 콘솔 인코딩이
# 달라 안 드러나고, 실제 러너에서만 나타난다.
env:
  PYTHONIOENCODING: utf-8
  PYTHONUTF8: "1"

jobs:
  # 우리 코드의 검사. 여기는 막는다 - 실패가 곧 우리 잘못이다.
  checks:
    name: 파이썬 검사
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: 검사 넷을 돌린다
        shell: bash
        run: |
          uv run ruff check .
          uv run ruff format --check .
          uv run mypy tools
          uv run pytest -q

      - name: 문서 분량 상한
        shell: bash
        run: uv run python tools/docs-check/docs_check.py

      # 이 워크플로 자신을 잰다. 여기서 막는 넷은 전부 기존 저장소에서 재발한 것이다.
      - name: 워크플로 규칙
        shell: bash
        run: uv run python tools/ci-check/ci_check.py

  # 조립하고 빌드한다. 실패 사유는 셋뿐이다.
  #
  #   1. 조립 실패 - 덧대기 앵커를 못 찾음, 대장 형식 오류
  #   2. 빌드 실패 - dotnet build -c Release -warnaserror
  #   3. 미번역 인벤토리를 산출물로 못 남김
  #
  # 미번역 개수 자체는 실패가 아니다. 업스트림이 하루 1.4개꼴로 태그를 내는데
  # 번역 완성을 게이트로 걸면 그것이 매일 무효화되고, 그러면 빨간불이 신호이기를
  # 그만둔다. 숫자는 잡 요약에 적고 초록으로 끝낸다.
  build:
    name: 조립과 빌드
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Dalamud 참조
        id: refs
        uses: ./.github/actions/dalamud-refs
        with:
          token: ${{ github.token }}

      # 실패 사유 1.
      - name: 조립
        shell: bash
        run: uv run python tools/assemble/assemble.py | tee assemble.log

      # 실패 사유 2. Debug로 빌드하지 않는다 - 원본 csproj의 DeployToDevFolder가
      # Debug 조건이라 결과가 개발용 플러그인 자리로 자동 복사된다.
      - name: 빌드
        shell: bash
        env:
          DALAMUD_HOME: ${{ steps.refs.outputs.home }}
        run: |
          dotnet build -c Release -warnaserror \
            build/FF14Accessibility/FF14Accessibility.csproj

      # 설치 프로그램의 한국어. 대장의 그물 밖이라 이 검사가 없으면 그 문장들은
      # 고아 검출도 미번역 로그도 못 받고, 키가 빠지면 조용히 영어로 떨어진다.
      # 조립 뒤에 도는 까닭은 소스 아홉 파일이 네 군데로 흩어져 있어서다 -
      # 판정 대상은 실제로 나갈 트리다.
      - name: 설치 프로그램 한국어
        shell: bash
        run: uv run python tools/loc-check/loc_check.py

      # `Pick`을 아예 안 거치고 맨 리터럴로 박힌 외국어. 조립 도구는 표식과 `Pick`만
      # 보므로 이 부류를 원리적으로 못 본다 - 적용에도 미적용에도 못 읽음에도 안 잡힌다.
      # 옛 저장소에서 사용자가 인게임에서 `Übergang`을 들은 것이 이 자리였다.
      - name: 발화 사각지대
        shell: bash
        run: uv run python tools/ko-speech/ko_speech.py

      # 번역이 쓰는 낱말 중 게임에 없는 것. `korean/terms.json`의 `not_found`가
      # "이 낱말은 게임에 없으니 안 쓴다"는 판정을 담는데 그것을 지키는 자리다.
      #
      # 여기서 도는 것은 **영어 잔여 검사뿐이다.** 낱말 대조는 게임 덤프
      # (`tools/ko-terms/out/`)를 읽는데, 그것은 스퀘어에닉스의 게임 텍스트라
      # 재배포하지 않기로 하고 `.gitignore`에 넣었다. 러너에는 그 파일이 없고
      # 앞으로도 없을 것이므로, 이 단계는 덤프가 없다고 찍고 낱말 대조를
      # 건너뛴 채 지난다. **이 초록을 낱말 검사가 돌았다는 뜻으로 읽으면 안 된다.**
      #
      # `--require-dump`를 여기 걸지 않는 까닭도 그것이다 - 덤프가 영영 없으니
      # 이 잡이 영영 빨갛고, 그러면 빨간불이 신호이기를 그만둔다. 낱말 대조를
      # 강제하는 자리는 발행 경로다: `tools/pack/release.py`의 `ko-words` 단계가
      # `--require-dump`로 부르고, 덤프가 없으면 자산을 올리기 전에 선다.
      - name: 게임 낱말
        shell: bash
        run: uv run python tools/ko-words/ko_words.py

      # 플러그인이 참조하는 멤버가 한국판 달라무드의 어셈블리에 실제로 있는지.
      # 한국판은 FFXIVClientStructs를 7.51로 낮춰 싣고, 글로벌용으로 빌드된
      # 플러그인은 그 차이로 적재는 되는데 호출 시점에 죽는다.
      - name: 어셈블리 참조
        shell: bash
        env:
          DALAMUD_HOME: ${{ steps.refs.outputs.home }}
        run: |
          dotnet run -c Release --project tools/asmref-check -- \
            build/FF14Accessibility/bin/Release/net10.0-windows/FF14Accessibility.dll \
            "$DALAMUD_HOME"

      # 이번 판 노트가 있으면 잰다. 발행 직전 한 번만 돌리면 늦다 - 노트가 여러
      # 커밋에 걸쳐 고쳐지는 동안 한 번도 안 도는 판이 실제로 있었다.
      #
      # 원본 노트는 여기서 안 받는다. 커버리지 검사(N21~N23)가 그만큼 안 도는데,
      # 검사기가 건너뛴 것을 화면에 남기므로 다 옮긴 판과 안 본 판이 같아 보이지는
      # 않는다. 그 셋은 발행할 때 tools/pack/release.py가 원본을 받아 다시 잰다.
      - name: 릴리스 노트
        shell: bash
        run: |
          version=$(uv run python -c "
          import json
          report = json.load(open('build/assemble-report.json', encoding='utf-8'))
          print(report['versions']['FF14Accessibility/FF14Accessibility.csproj'])
          ")
          notes="docs/release-notes/$version.md"
          if [ -f "$notes" ]; then
            uv run python tools/notes-check/notes_check.py --version "$version" "$notes"
          else
            echo "이번 판($version) 노트가 아직 없다. 발행 전에 쓴다."
          fi

      # 실패 사유 3. 이 인벤토리가 없으면 무엇이 영어로 나가는지 아무도 못 본다.
      - name: 미번역 인벤토리
        uses: actions/upload-artifact@v4
        with:
          name: assemble-report
          path: build/assemble-report.json
          if-no-files-found: error

      - name: 플러그인
        uses: actions/upload-artifact@v4
        with:
          name: FF14Accessibility
          path: build/FF14Accessibility/bin/Release/net10.0-windows/
          if-no-files-found: error

      # 앞이 실패해도 여기까지 온 것은 적는다. 요약이 실패에 딸려 사라지면
      # 무엇이 어디까지 갔는지 로그를 뒤져야 한다. 같은 결함이 세 번 재발했다.
      - name: 잡 요약
        if: always()
        shell: bash
        run: |
          {
            echo "## 조립"
            echo
            echo '```'
            cat assemble.log 2>/dev/null || echo "조립이 결과를 못 남겼다."
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # 현황판에 손으로 적은 숫자가 실측과 맞는지. 막지 않는다.
  citations:
    name: 문서 숫자 대조
    needs: build
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - uses: actions/download-artifact@v4
        with:
          name: assemble-report
          path: report

      - name: 대조
        shell: bash
        run: uv run python tools/docs-check/docs_check.py --report report/assemble-report.json | tee citations.log

      - name: 잡 요약
        if: always()
        shell: bash
        run: |
          {
            echo "## 현황판 기준선 대조"
            echo
            echo "머지를 막지 않는다. 번역 잔량은 업스트림이 매일 흔드는 값이다."
            echo
            echo '```'
            cat citations.log 2>/dev/null || echo "대조가 결과를 못 남겼다."
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
